# Offline checks for RollbackWitness: unit/integration tests against a real FalkorDB and the
# deterministic end-to-end smoke and browser acceptance. No secrets, live model calls or deploy step.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        mcp: [false, true]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      falkordb:
        # Same pinned server the project is verified against (docker-compose.yml).
        image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up environment (Python 3.12 via uv)
        run: sh scripts/setup.sh ${{ matrix.mcp && '--mcp' || '' }}

      - name: Offline test suite (live-model tests excluded)
        run: .venv/bin/python -m pytest -q -m "not live"

      - name: Assert optional SDK tests execute
        if: matrix.mcp
        run: |
          .venv/bin/python -c "import mcp; from importlib.metadata import version; assert version('mcp') == '2.3.0'"
          .venv/bin/python -m pytest tests/test_mcp.py tests/test_mcp_integration.py tests/test_mcp_stdio.py -q --junitxml=mcp-results.xml
          .venv/bin/python -c "import xml.etree.ElementTree as E; s=E.parse('mcp-results.xml').find('testsuite'); assert int(s.get('tests')) > 0 and int(s.get('skipped')) == 0"

      - name: Deterministic end-to-end smoke (no model key)
        run: .venv/bin/python scripts/smoke.py

      - name: Browser acceptance (synthetic grounding, real reader checks)
        shell: bash
        run: |
          UI_BROWSER_BINARY="$(command -v google-chrome)"
          export UI_BROWSER_BINARY
          mkdir -p artifacts
          .venv/bin/python tests/ui/serve_fixture.py > artifacts/ui-server.log 2>&1 &
          ui_server_pid=$!
          trap 'kill -TERM "$ui_server_pid" 2>/dev/null || true; wait "$ui_server_pid" || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8002/api/snapshots > /dev/null
          timeout 180s node tests/ui/check.mjs

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.mcp }}
          path: |
            artifacts/ui-server.log
            artifacts/screens/decision-review/

  mcp-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install optional SDK through PowerShell setup
        run: powershell -ExecutionPolicy Bypass -File scripts/setup.ps1 -Mcp
      - name: Portable bridge, SDK, stdio and UI contracts (no FalkorDB or model)
        run: .venv/Scripts/python.exe -m pytest tests/test_mcp_client.py tests/test_mcp.py tests/test_mcp_stdio.py tests/test_ui_matcher.py -q
