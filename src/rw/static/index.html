<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RollbackWitness — can this rollback read what the newer release saved? (synthetic fixture)</title>
<style>
:root{
  --paper:#f6f7f8; --ink:#14171a; --mute:#5b646c; --rule:#d2d7db; --wash:#eceff1;
  --accent:#0a58a8;
  --red:#b42318; --red-wash:#fbebe9; --green:#17653a; --green-wash:#e5f2ea; --amber:#855000; --amber-wash:#faefd2;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono,code,pre,.hash{font-family:var(--mono);font-size:.84rem}
.mute{color:var(--mute)}

/* status bar: facts that must always be visible */
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#eef1f3;font-size:.86rem}
.bar .in{max-width:1100px;margin:0 auto;padding:7px 28px;display:flex;gap:4px 22px;flex-wrap:wrap;align-items:baseline}
@media (min-width:1500px){.bar .in{max-width:1500px;flex-wrap:nowrap;white-space:nowrap}}
.bar b{font-weight:700}
.bar .model{font-family:var(--mono);font-size:.8rem}
.bar .replay{color:#ffd37a;font-weight:700}
.bar .live{color:#8fe0ae;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:30px 28px 28px}
h1{font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:-.015em}
.lede{margin:4px 0 0;font-size:1.15rem;font-style:italic;color:var(--mute)}

/* a section = gutter name + content; rules, not cards */
.sec{scroll-margin-top:56px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 28px;padding:26px 0;border-top:1px solid var(--rule)}
.sec>h2{margin:3px 0 0;font-size:1rem;font-weight:700;color:var(--mute)}
.sec>.body{min-width:0}
.sec.first{margin-top:22px;border-top:2px solid var(--ink)}
@media (max-width:820px){.sec{grid-template-columns:1fr}.sec>h2{margin-bottom:8px}}

label{display:block;font-size:.92rem;color:var(--mute);margin:0 0 3px}
textarea,input[type=text],select{font:inherit;width:100%;padding:8px 10px;border:1px solid #8a949c;background:#fff;color:var(--ink);border-radius:2px}
textarea{min-height:60px;resize:vertical;font-size:1.08rem}
textarea[readonly]{background:var(--wash)}
.row{display:flex;gap:14px 18px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.row>.grow{flex:1 1 260px}
.check{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink);font-size:.95rem;cursor:pointer;white-space:nowrap}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:2px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;color:var(--accent);padding:7px 16px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
button{font:inherit;font-weight:700;font-size:.97rem;padding:8px 18px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:2px;cursor:pointer}
button.quiet{background:#fff;color:var(--accent)}
button.link{border:0;background:none;color:var(--accent);padding:0;font-weight:400;text-decoration:underline;font-size:inherit}
button:disabled{opacity:.5;cursor:default}
.hint{color:var(--mute);font-size:.93rem;margin:6px 0 0}

.busy,.notice{margin:16px 0 0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--wash)}
.fault{margin:16px 0 0;padding:12px 16px;border-left:5px solid var(--red);background:var(--red-wash)}
.fault b{color:var(--red)}
.fault pre{margin:6px 0 0;white-space:pre-wrap}

/* agent question + quotes */
.ask{font-size:1.3rem;line-height:1.4;margin:0 0 12px;max-width:70ch}
.said{margin:0 0 4px;color:var(--mute)}
.quote{margin:9px 0 0;padding:0 0 0 14px;border-left:2px solid var(--rule);max-width:78ch}
.quote q{quotes:"\201C" "\201D"}
.quote .src{display:block;font-size:.88rem;color:var(--mute)}
.quote .src button{font-size:.88rem}

/* fleet */
table{border-collapse:collapse;width:100%}
th{font-weight:400;font-size:.9rem;color:var(--mute);text-align:left;padding:0 12px 6px 0;border-bottom:1px solid var(--rule)}
td{padding:9px 12px 9px 0;vertical-align:top;border-bottom:1px solid var(--rule)}
.fleet td.svc{font-weight:700;width:9rem}
.fleet .vers{font-family:var(--mono);font-size:.95rem;white-space:nowrap;width:11rem}
.chg{font-weight:700}
.keep{color:var(--mute)}
.cand{float:right;color:var(--mute);font-size:.92rem}

/* verdict: the one loud element */
.verdict{font-size:clamp(3.4rem,9vw,6.8rem);line-height:.95;font-weight:700;letter-spacing:-.025em;margin:0}
.verdict.BOUNDED_PASS,.verdict.NEEDS_EVIDENCE{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1}
.verdict.BLOCKED{color:var(--red)} .verdict.BOUNDED_PASS{color:var(--green)} .verdict.NEEDS_EVIDENCE{color:var(--amber)}
.because{font-size:1.2rem;margin:10px 0 0;max-width:62ch}
.caption{margin:8px 0 0;font-weight:700}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;margin:22px 0 0;gap:0}
.pair .vs{align-self:center;padding:0 16px;color:var(--mute);font-style:italic}
.pane{padding:16px 20px;border-top:5px solid var(--rule);background:#fff}
.pane .what{font-size:.98rem;color:var(--mute)}
.pane .word{font-size:2.5rem;font-weight:700;line-height:1.1;margin:4px 0 6px;letter-spacing:-.01em}
.pane.GREEN,.pane.PASS{border-top-color:var(--green);background:var(--green-wash)} .pane.GREEN .word,.pane.PASS .word{color:var(--green)}
.pane.FAIL,.pane.RED{border-top-color:var(--red);background:var(--red-wash)} .pane.FAIL .word,.pane.RED .word{color:var(--red)}
.pane.UNKNOWN{border-top-color:var(--amber);background:var(--amber-wash)} .pane.UNKNOWN .word{color:var(--amber)}
@media (max-width:820px){.pair{grid-template-columns:1fr}.pair .vs{padding:6px 0}}
.missing{margin:14px 0 0;padding:0;list-style:none}
.missing li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--rule)}
.missing li::before{content:"";position:absolute;left:2px;top:12px;width:12px;height:12px;border:2px solid var(--amber)}

/* sub-blocks inside RESULT */
.sub{margin:30px 0 0}
.sub>h3{margin:0 0 8px;font-size:1.05rem}
.sub>h3 small{font-weight:400;color:var(--mute);margin-left:8px;font-size:.9rem}

/* witness chain */
.chain{display:flex;flex-direction:column;gap:18px}
.chain .crow{display:flex;flex-wrap:nowrap;align-items:flex-start;overflow-x:auto;padding-bottom:4px}
.node{border-top:3px solid var(--ink);padding:5px 0 0;min-width:5.5rem;flex:0 0 auto}
.node .lbl{font-size:.82rem;color:var(--mute);line-height:1.2}
.node .id{font-weight:700;font-size:.95rem;line-height:1.25;white-space:nowrap;overflow-wrap:normal}
.node.hit{border-top-color:var(--red)}
.edge{align-self:flex-start;padding:2px .5rem 0;text-align:center;font-family:var(--mono);font-size:.74rem;color:var(--accent);white-space:nowrap;line-height:1.15;flex:0 0 auto}
.edge::after{content:"";display:block;border-top:1px solid var(--accent);margin-top:5px}

/* matrix */
.matrix th,.matrix td{padding:8px 12px;border:1px solid var(--rule)}
.matrix th{vertical-align:bottom;background:var(--wash);color:var(--ink);font-size:.92rem}
.matrix th small{display:block;color:var(--mute);font-weight:400}
.matrix td.rh{background:var(--wash);font-weight:700}
.cellbtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:6px 10px;font-weight:700;text-align:center;font-size:.95rem;border-bottom:3px solid transparent}
.cellbtn.PASS{background:var(--green-wash);color:var(--green)} .cellbtn.FAIL{background:var(--red-wash);color:var(--red)}
.cellbtn.UNKNOWN{background:var(--amber-wash);color:var(--amber)} .cellbtn.NONE{background:#fff;color:var(--mute);font-weight:400}
.cellbtn.sel{border-bottom-color:var(--ink)}
.cellbtn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.na{color:var(--mute)}
.receipt{margin:14px 0 0;padding:4px 0 4px 18px;border-left:3px solid var(--ink)}
.receipt h4{margin:0 0 6px;font-size:1rem}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 20px;margin:6px 0}
dl.kv dt{color:var(--mute);font-size:.93rem} dl.kv dd{margin:0;word-break:break-word}
.hash{cursor:pointer;border-bottom:1px dotted var(--mute);word-break:break-all}
details{margin:12px 0 0} summary{cursor:pointer;font-weight:700}
details table{margin-top:8px}
pre.out{white-space:pre-wrap;margin:8px 0 0;padding:10px 12px;background:var(--wash);overflow-x:auto}

/* alternatives */
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:18px}
.cands>div{padding:0 24px 0 0}
.cands>div+div{padding:0 0 0 24px;border-left:1px solid var(--rule)}
.cands .v{font-size:2rem;font-weight:700;line-height:1.1;margin:2px 0 6px}
.cands .v.BLOCKED{color:var(--red)} .cands .v.BOUNDED_PASS{color:var(--green)} .cands .v.NEEDS_EVIDENCE{color:var(--amber)}
.cands .on{border-bottom:3px solid var(--ink);display:inline-block;margin-bottom:6px}

.only{display:inline-block;margin:0 0 10px;font-weight:700;border:2px solid var(--ink);padding:2px 10px}
.simdone{margin:18px 0 0;padding:12px 16px;background:var(--wash);border-left:5px solid var(--ink)}
.picker option.q{color:var(--mute)}
select.picker{text-overflow:ellipsis}
.row>.wide{flex:2 1 460px}
.snap{flex:1 1 34rem;max-width:36rem}
.snap select{text-overflow:clip}
footer{max-width:1100px;margin:0 auto;padding:18px 28px 48px;border-top:1px solid var(--rule);color:var(--mute);font-size:.92rem}
footer p{margin:2px 0}
@media (min-width:1700px){html{font-size:18px}.wrap,footer{max-width:1320px}}
</style>
</head>
<body>
<div class="bar"><div class="in" id="bar"></div></div>
<div class="wrap">
  <h1>RollbackWitness</h1>
  <p class="lede">Can this rollback read the data the newer release already saved?</p>
  <div id="app"></div>
</div>
<footer id="foot"></footer>

<script>
"use strict";
const DEFAULT_REQUEST = "Undo the basket rollout, but keep the receipt correction.";
const CAPTION_PASS = "BOUNDED_PASS covers byte/shape readability of the modeled records only — not production safety.";
const FALKOR = "FalkorDB 6.0.2";
// Guided demo only pre-fills the human inputs. Every result still comes from the server.
const GUIDED = {
  request: DEFAULT_REQUEST,
  answer: "Keep checkout 2.1 for the receipt correction; its basket headings only show for carts that already have baskets, which is acceptable. Undo the basket rollout in cart.",
  operator: "dana.oncall", approver: "marcus.lead",
};
const S = { inv:null, view:0, busy:null, error:null, sel:null, transcripts:[], guided:false, replayUsed:null,
  form:{req:DEFAULT_REQUEST, snapshot:"snap-001", mode:"live", replay:"", answerReplay:"", altReplay:"", answer:"", scope:"", approver:""} };

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===null||v===undefined||v===false) continue;
    if (k==="class") n.className=v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v===true) n.setAttribute(k,"");
    else n.setAttribute(k,v);
  }
  for (const c of kids.flat(Infinity)){ if (c===null||c===undefined||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}
function hash(v, n=8){
  if (v===null||v===undefined) return el("span",{class:"na"},"null");
  const full=String(v), s=full.replace(/^sha256:/,"");
  const short=()=>s.length>n+1?s.slice(0,n)+"…":s;
  const t=el("span",{class:"hash",tabindex:"0",role:"button",title:"Click to show the full value"}, short());
  let open=false;
  const flip=()=>{open=!open; t.textContent=open?full:short();};
  t.addEventListener("click",flip); t.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
  return t;
}
class ApiError extends Error{ constructor(status,msg){ super(msg); this.status=status; } }
async function api(method, path, body){
  let r;
  try{ r = await fetch(path,{method, headers: body?{"Content-Type":"application/json"}:{}, body: body?JSON.stringify(body):undefined}); }
  catch(e){ throw new ApiError(0,"The local server did not answer."); }
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok){
    let d = data && (data.detail!==undefined?data.detail:data.reason);
    if (Array.isArray(d)) d = d.map(x=>(x.loc||[]).slice(1).join(".")+": "+x.msg).join("\n");
    else if (d && typeof d==="object") d = (d.message||d.reason||"") + (d.drift&&d.drift.length? "\n"+d.drift.join("\n"):"");
    throw new ApiError(r.status, d||r.statusText);
  }
  return data;
}
async function run(label, fn){
  S.busy=label; S.error=null; render();
  try{ await fn(); }catch(e){ S.error = e instanceof ApiError ? e : new ApiError(-1,e.message); }
  S.busy=null; render();
}
const attempts = () => S.inv ? S.inv.attempts : [];
const cur = () => S.inv && S.inv.attempts[Math.min(S.view, S.inv.attempts.length-1)];
const isAsk = a => !!(a && a.clarification);
const disp = a => a && a.report ? a.report.verification.disposition : null;
const labels = () => (S.inv && S.inv.release_labels) || {};
const lab = rid => labels()[rid] || rid;
/* --- replay matcher: pure helpers, loaded by tests/js/replay_matcher.test.mjs under node --test --- */
const withAnswer = (req,q,a) => `${req}\n\nAgent asked: ${q}\nOperator answered: ${a}`;   // mirrors pipeline.with_answer
const replayMatches = (transcripts, requestText, question, answer) => {
  const bound = withAnswer(requestText, question, String(answer==null?"":answer).trim());
  return (transcripts||[]).filter(t=>t.request_text===bound);
};
/* --- end replay matcher --- */
const transcriptModel = file => { const t=S.transcripts.find(x=>x.replay_path===file); return t?t.model:null; };

/* ---------- actions ---------- */
function start(){
  const f=S.form;
  run(f.mode==="live"?"The agent is reading the changelogs and querying the graph…":"Replaying the saved agent run…", async()=>{
    const body={request_text:f.req, mode:f.mode, snapshot:f.snapshot}; if(f.mode==="replay") body.replay_path=f.replay;
    S.inv=null; S.sel=null;
    S.inv = await api("POST","/api/investigations",body); S.view=attempts().length-1; S.replayUsed=f.mode==="replay"?[f.replay]:[];
  });
}
async function refresh(){ S.inv = await api("GET","/api/investigations/"+S.inv.id); }
function sendAnswer(){
  run("Re-grounding with your answer…", async()=>{
    const body={answer:S.form.answer.trim()}; if(S.inv.mode==="replay") body.replay_path=S.form.answerReplay;
    S.inv = await api("POST",`/api/investigations/${S.inv.id}/answer`,body); S.view=attempts().length-1; S.sel=null;
    if(S.inv.mode==="replay") S.replayUsed.push(S.form.answerReplay);
  });
}
function confirmScope(a){
  run("Running the graph queries and reader probes…", async()=>{
    await api("POST",`/api/investigations/${S.inv.id}/plans/${a.plan_hash}/confirm-scope`,{confirmed_by:S.form.scope.trim()});
    await refresh(); S.sel=null; S.scrollTo="result";
  });
}
function askAlt(){
  run("Asking the agent for an alternative…", async()=>{
    const body = S.inv.mode==="replay" ? {replay_path:S.form.altReplay} : {};
    S.inv = await api("POST",`/api/investigations/${S.inv.id}/alternative`,body);
    if(S.inv.mode==="replay") S.replayUsed.push(S.form.altReplay);
    S.view = attempts().length-1; S.sel=null;
  });
}
function approve(a){
  run("Recording approval…", async()=>{
    await api("POST",`/api/investigations/${S.inv.id}/plans/${a.plan_hash}/approve`,{approved_by:S.form.approver.trim()});
    await refresh();
  });
}
function simulate(a){
  run("Running the local simulation…", async()=>{
    await api("POST",`/api/investigations/${S.inv.id}/plans/${a.plan_hash}/simulate`);
    await refresh();
  });
}
function setGuided(on){
  S.guided=on;
  if(on){
    if(S.form.mode==="live" && !S.inv) S.form.req=GUIDED.request;
    if(!S.form.answer) S.form.answer=GUIDED.answer;
    if(!S.form.scope) S.form.scope=GUIDED.operator;
    if(!S.form.approver) S.form.approver=GUIDED.approver;
  }
  render();
}

/* ---------- small builders ---------- */
function field(label, id, key, opts={}){
  const inp = el("input",{type:"text",id,value:S.form[key],placeholder:opts.ph||"",autocomplete:"off"});
  inp.addEventListener("input",()=>{S.form[key]=inp.value; if(opts.after) opts.after();});
  return el("div",{class:opts.cls||"grow"}, el("label",{for:id},label), inp);
}
function fillPicker(wrap, id, key, label, items){
  if(!items.length){
    wrap.replaceChildren(el("label",{for:id},label),
      el("p",{class:"hint",style:"margin:0"}, "No saved run in artifacts/grounding matches. Replay can only reuse a transcript recorded for this exact text."));
    S.form[key]=""; return;
  }
  const sel=el("select",{id,class:"picker"}, items.map(t=>{
    const text=`${t.outcome==="question"?"asks a question":t.outcome==="proposal"?"proposes a fleet":"saved run"} · ${t.model} · ${t.replay_path.replace(".json","").slice(0,8)}`;
    return el("option",{value:t.replay_path,title:text},text);}));
  if(!items.some(t=>t.replay_path===S.form[key])) S.form[key]=items[0].replay_path;
  sel.value=S.form[key];
  sel.addEventListener("change",()=>{ S.form[key]=sel.value; if(key==="replay"){ const t=S.transcripts.find(x=>x.replay_path===sel.value); if(t){S.form.req=t.request_text;} render(); }});
  wrap.replaceChildren(el("label",{for:id},label), sel);
}
function replayPicker(id, key, label, items){
  const wrap=el("div",{class:"grow wide"});
  fillPicker(wrap, id, key, label, items);
  return wrap;
}
function cites(list, only){
  const out=[];
  for(const c of list){
    const rid=c.release_id, svc=rid?lab(rid).split(" ")[0]:null;
    if(only && svc!==only) continue;
    out.push(c);
  }
  return out.map(c=>{
    const rid=c.release_id;
    const detail=el("span",{class:"mono",hidden:true}, c.excerpt_id+"  ", hash(c.content_hash));
    const btn=el("button",{class:"link",type:"button"},"source ↗");
    btn.addEventListener("click",()=>{detail.hidden=!detail.hidden;});
    return el("p",{class:"quote"}, el("q",{},c.quote), el("span",{class:"src"}, (rid?lab(rid):"unmatched release")+" "+(c.kind||"excerpt")+" · ", btn, " ", detail));
  });
}

/* ---------- views ---------- */
function bar(){
  const b=document.getElementById("bar"); b.replaceChildren();
  const a=cur();
  const live = a ? !!a.is_live_provider : S.form.mode==="live";
  b.append(el("span",{}, el("b",{},"Synthetic fixture"), " — not production data"));
  b.append(el("span",{},"snapshot ", el("span",{class:"mono"},(S.inv?S.inv.snapshot_id:"snapshot:"+S.form.snapshot).replace(/^snapshot:/,""))));
  b.append(el("span",{},FALKOR));
  if(a){
    const g=a.grounding, orig=g.live?g.model:transcriptModel((g.model||"").replace(/^replay:/,""));
    b.append(el("span",{}, "model: ", el("span",{class:"model"}, orig||g.model), g.live?"":" (recorded)"));
  }
  const down = S.error && [0,502,503].includes(S.error.status);
  if(!a && S.form.mode==="live" && down) b.append(el("span",{class:"replay"},"Live model unavailable"));
  else if(!a && S.form.mode==="live") b.append(el("span",{class:"live"},"LIVE — not yet run"));
  else if(live) b.append(el("span",{class:"live"},"LIVE ●"));
  else if(!a || (!a.grounding.live && /^replay:/.test(a.grounding.model||""))) b.append(el("span",{class:"replay"},"REPLAY — not live"));
  else b.append(el("span",{class:"replay"},"NOT LIVE — "+(a.grounding.model||"unknown model")));
}

function requestView(){
  const f=S.form, replay=f.mode==="replay";
  const ta=el("textarea",{id:"req",readonly:replay}); ta.value=f.req; ta.addEventListener("input",()=>f.req=ta.value);
  const seg=el("div",{class:"seg",role:"group","aria-label":"Grounding mode"},
    el("button",{type:"button","aria-pressed":String(!replay),onclick:()=>{f.mode="live";render();}},"Live"),
    el("button",{type:"button","aria-pressed":String(replay),onclick:()=>{f.mode="replay"; render();}},"Replay saved run"));
  const first = S.transcripts.filter(t=>!t.request_text.includes("\n\nAgent asked:"));
  const guided=el("label",{class:"check"}, el("input",{type:"checkbox",checked:S.guided,onchange:e=>setGuided(e.target.checked)}), "Guided demo");
  let pick=null;
  if(replay){
    // replay needs the exact request the transcript was recorded for
    if(!first.some(t=>t.replay_path===f.replay) && first.length){ f.replay=first[0].replay_path; f.req=first[0].request_text; ta.value=f.req; }
    pick=replayPicker("replaypick","replay","Saved run", first);
  }
  const SNAPS=[["snap-001","snap-001 — complete inventory"],["snap-002-partial","snap-002-partial — coverage PARTIAL"],
    ["snap-003-orphan","snap-003-orphan — record with unknown writer/format"]];
  const snapSel=el("select",{id:"snapshot",title:"Which retained-state inventory the check runs against"}, SNAPS.map(([v,t])=>el("option",{value:v},t)));
  const snapTitle=()=>{snapSel.title=SNAPS.find(([v])=>v===snapSel.value)[1];};
  snapSel.value=f.snapshot; snapTitle(); snapSel.addEventListener("change",()=>{f.snapshot=snapSel.value; snapTitle(); render();});
  const snap=el("div",{class:"snap"}, el("label",{for:"snapshot"},"Snapshot"), snapSel);
  const go=el("button",{type:"button",onclick:start,disabled:!!S.busy||!f.req.trim()||(replay&&!f.replay)}, S.inv?"Investigate again":"Investigate");
  return el("section",{class:"sec first"}, el("h2",{},"Request"), el("div",{class:"body"},
    el("label",{for:"req"},"What should the rollback do?"), ta,
    el("div",{class:"row"}, seg, pick), el("div",{class:"row"}, snap, guided, go),
    replay? el("p",{class:"hint"},"Replay re-uses a saved agent run, so the request text comes with it. Nothing is sent to a model."):null));
}

function faultView(){
  const e=S.error; if(!e) return null;
  const live = S.form.mode==="live";
  if((e.status===502||e.status===503||e.status===0) && !S.inv && live){
    return el("div",{class:"fault",role:"alert"}, el("b",{},`Live model unavailable (${e.status||"no response"})`),
      el("pre",{},e.message),
      el("p",{class:"hint"},"No fallback was used. ", el("button",{class:"link",type:"button",onclick:()=>{S.form.mode="replay";S.error=null;render();}},"Switch to a saved replay"), " to continue the walkthrough."));
  }
  return el("div",{class:"fault",role:"alert"}, el("b",{},e.status>0?`Refused (${e.status})`:"Error"), el("pre",{},e.message));
}

function askView(a, answerable){
  const c=a.clarification;
  const sec=el("section",{class:"sec"}, el("h2",{},"The agent asks"));
  const body=el("div",{class:"body"}, el("p",{class:"ask"},c.question));
  if(c.unresolved.length) body.append(el("p",{class:"hint"},"Could not bind to one artifact: "+c.unresolved.join("; ")));
  body.append(...cites(c.citations||[]));
  if(answerable){
    const ta=el("textarea",{id:"answer",placeholder:"Your answer decides the fleet. The agent gets one question per investigation."}); ta.value=S.form.answer;
    const btn=el("button",{id:"answerbtn",type:"button",onclick:sendAnswer},"Answer");
    const pick=el("div",{class:"grow"});
    const refresh=()=>{
      // Recompute the matching replay as the answer is typed. The textarea is never re-created, so
      // focus and caret stay put while the picker and the Answer button update.
      if(S.inv.mode==="replay")
        fillPicker(pick,"answerpick","answerReplay","Saved run for this answer",
          replayMatches(S.transcripts, S.inv.request_text, c.question, S.form.answer));
      btn.disabled=!!S.busy||!S.form.answer.trim()||(S.inv.mode==="replay"&&!S.form.answerReplay);
    };
    ta.addEventListener("input",()=>{S.form.answer=ta.value; refresh();});
    refresh();
    body.append(el("div",{style:"margin-top:16px"}, el("label",{for:"answer"},"Your answer"), ta),
      el("div",{class:"row"}, S.inv.mode==="replay"?pick:null, btn),
      S.inv.mode==="replay"?el("p",{class:"hint"},"Replay only works with the exact answer text the saved run was recorded with — Guided demo fills it in."):null);
  }
  return sec.append(body), sec;
}
function answeredNote(){
  const first=attempts().find(isAsk); if(!first || !S.inv.answered) return null;
  const t=S.inv.request_text, i=t.indexOf("\nOperator answered: ");
  const sec=el("section",{class:"sec"}, el("h2",{},"The agent asked"));
  sec.append(el("div",{class:"body"}, el("p",{class:"ask"},first.clarification.question),
    el("p",{class:"said"},"Operator answered:"), el("p",{style:"margin:0;max-width:70ch"}, i>=0? t.slice(i+"\n\nOperator answered: ".length-1):"")));
  return sec;
}

function fleetView(a){
  const sec=el("section",{class:"sec"}, el("h2",{},"Proposed fleet"));
  const body=el("div",{class:"body"}); sec.append(body);
  if(a.validation_errors.length){
    body.append(el("p",{style:"margin:0 0 6px;font-weight:700"},"Proposal rejected. Nothing was checked."),
      el("ul",{style:"margin:0;padding-left:20px"}, a.validation_errors.map(e=>el("li",{},e))));
    if(a.grounding.result && a.grounding.result.rationale) body.append(el("p",{class:"hint"},"The agent said: "+a.grounding.result.rationale));
    return sec;
  }
  if(!a.plan) return null;
  const label=a.plan.label? el("span",{class:"cand"},a.plan.label):null;
  const rows=a.plan.fleet.map(f=>{
    const flags=Object.entries(f.flags).map(([k,v])=>k+" = "+v).join(", ");
    return el("tr",{}, el("td",{class:"svc"},f.service),
      el("td",{class:"vers"}, (f.current_version||"?")+" → "+(f.proposed_version||"?")),
      el("td",{}, el("span",{class:f.changed?"chg":"keep"}, f.changed?"change":"keep"), flags? el("span",{class:"mono"},"  "+flags):null,
        cites(a.citations||[], f.service)));
  });
  body.append(label, el("table",{class:"fleet"}, el("tbody",{},rows)));
  const g=a.grounding.result;
  if(g && g.rationale) body.append(el("p",{class:"hint"},"The agent said: "+g.rationale));
  if(a.grounding.tool_calls && a.grounding.tool_calls.length)
    body.append(el("details",{}, el("summary",{},`Agent tool calls (${a.grounding.tool_calls.length})`), el("pre",{class:"out"}, a.grounding.tool_calls.map(c=>JSON.stringify(c)).join("\n"))));
  return sec;
}

function scopeView(a){
  const sec=el("section",{class:"sec"}, el("h2",{},"Scope"));
  const body=el("div",{class:"body"}); sec.append(body);
  if(a.report){
    const c=a.report.scope_confirmation;
    body.append(el("p",{style:"margin:0"},"Scope confirmed by ", el("b",{},c.confirmed_by), " for checking — plan ", hash(a.plan_hash), ". This is not an approval."));
    return sec;
  }
  body.append(el("p",{style:"margin:0;max-width:64ch"},"Check this fleet against every saved record it could meet. Confirming only sets what gets checked; it does not approve any change."),
    el("div",{class:"row"}, field("Operator","scope","scope",{ph:"your name, not the model",after:()=>{const b=document.getElementById("scopebtn"); if(b) b.disabled=!!S.busy||!S.form.scope.trim();}}),
      el("button",{id:"scopebtn",type:"button",onclick:()=>confirmScope(a),disabled:!!S.busy||!S.form.scope.trim()},"Confirm scope for checking")));
  return sec;
}

function receiptMap(rep){ const m={}; for(const r of rep.verification.receipts) m[r.obligation_hash]=r; return m; }

function becauseText(v, rm){
  if(v.disposition==="BLOCKED"){
    const ob=v.obligations.find(o=>v.blocking_receipts.includes(o.obligation_hash));
    if(!ob) return "A retained record cannot be read.";
    const n=v.blocking_receipts.length;
    return `${lab(ob.tuple.release_id)} starts, but cannot read ${ob.tuple.record_id}, saved by ${ob.writer_release_id?lab(ob.writer_release_id):"an unknown release"}.`+(n>1?` ${n-1} more blocking read${n>2?"s":""} below.`:"");
  }
  if(v.disposition==="NEEDS_EVIDENCE") return "Evidence is missing for at least one required check. This is not a pass.";
  return "Every required reader opened every saved record it could meet.";
}

function resultView(a){
  const rep=a.report, v=rep.verification, rm=receiptMap(rep);
  const sec=el("section",{class:"sec",id:"result"}, el("h2",{},"Result"));
  const body=el("div",{class:"body"}); sec.append(body);
  body.append(el("p",{class:"verdict "+v.disposition},v.disposition), el("p",{class:"because"},becauseText(v,rm)));
  if(v.disposition==="BOUNDED_PASS") body.append(el("p",{class:"caption"},CAPTION_PASS));

  // the dominant contrast: the build loads, the reader fails
  const startup=rep.startup_checks||{};
  const svcs=Object.keys(startup).filter(s=>v.obligations.some(o=>o.tuple.service===s));
  svcs.sort((x,y)=>pairScore(y,v,rm)-pairScore(x,v,rm));
  const quiet=svcs.slice(1).map(svc=>{
    const sc=startup[svc], obs=v.obligations.filter(o=>o.tuple.service===svc), rs=obs.map(o=>rm[o.obligation_hash]);
    const r = rs.some(x=>x&&x.result==="FAIL")?"FAIL": rs.some(x=>!x||x.result==="UNKNOWN")?"UNKNOWN":"PASS";
    return `${lab(sc.release_id)}: startup ${sc.result}, retained records ${r}`+(r==="PASS"&&v.gaps.length&&v.disposition!=="BOUNDED_PASS"?" (modeled records read; evidence gaps below)":"");});
  for(const svc of svcs.slice(0,1)){
    const sc=startup[svc], obs=v.obligations.filter(o=>o.tuple.service===svc), rs=obs.map(o=>rm[o.obligation_hash]);
    const r = rs.some(x=>x&&x.result==="FAIL")?"FAIL": rs.some(x=>!x||x.result==="UNKNOWN")?"UNKNOWN":"PASS";
    const unresolvedPass = r==="PASS" && v.disposition!=="BOUNDED_PASS" && v.gaps.length>0;
    const bad=obs.find(o=>rm[o.obligation_hash]&&rm[o.obligation_hash].result==="FAIL");
    const badR=bad&&rm[bad.obligation_hash];
    body.append(el("div",{class:"pair"},
      el("div",{class:"pane "+sc.result}, el("div",{class:"what"},`${lab(sc.release_id)} startup check`), el("div",{class:"word"},sc.result==="GREEN"?"GREEN":sc.result),
        el("div",{class:"mono"},sc.result==="GREEN"?"build loads · exit "+sc.exit:"exit "+sc.exit)),
      el("div",{class:"vs"}, r==="FAIL"?"but":"and"),
      el("div",{class:"pane "+(unresolvedPass?"UNKNOWN":r)}, el("div",{class:"what"},`${lab(sc.release_id)} reading retained records`), el("div",{class:"word"},unresolvedPass?"UNRESOLVED":r),
        el("div",{class:"mono"}, unresolvedPass? `${obs.length} modeled record${obs.length>1?"s":""} read · ${v.gaps.length} evidence gap${v.gaps.length>1?"s":""} below` : badR? `${bad.tuple.record_id} unreadable — ${badR.error_type||"error"}`: r==="PASS"?`${obs.length} record${obs.length>1?"s":""} read`: `${obs.length} check${obs.length>1?"s":""} unresolved`))));
  }

  if(quiet.length) body.append(el("p",{class:"hint",style:"margin-top:12px"}, "Also checked — "+quiet.join("; ")+"."));
  if(v.disposition==="NEEDS_EVIDENCE" || v.gaps.length){
    body.append(el("div",{class:"sub"}, el("h3",{},`What is missing`, el("small",{},`${v.gaps.length} gap${v.gaps.length===1?"":"s"}`)),
      v.gaps.length? el("ul",{class:"missing"}, v.gaps.map(g=>el("li",{}, el("b",{},g.kind.replace(/_/g," ")), "  ", el("span",{class:"mono"},g.subject), el("br"), g.detail))):
        el("p",{class:"hint"},"No gaps recorded.")));
  }

  if(!v.obligations.length){
    body.append(el("p",{class:"hint"},"No reader/record obligations were derived for this plan."));
  } else {
    if(S.sel===null || !v.obligations.some(o=>o.obligation_hash===S.sel)) S.sel = v.blocking_receipts[0] || v.obligations[0].obligation_hash;
    const ob=v.obligations.find(o=>o.obligation_hash===S.sel);
    body.append(el("div",{class:"sub"}, el("h3",{},"Why", el("small",{},"evidence path read from FalkorDB for the selected check")), chainView(ob, rm[ob.obligation_hash])));
    body.append(matrixView(v, rm));
    body.append(receiptView(ob, rm[ob.obligation_hash]));
  }

  const qs=rep.queries||[];
  body.append(el("details",{}, el("summary",{},`Graph queries executed (${qs.length})`),
    el("table",{}, el("thead",{},el("tr",{},el("th",{},"Query"),el("th",{},"Rows"),el("th",{},"Truncated"))),
      el("tbody",{}, qs.map(q=>el("tr",{}, el("td",{class:"mono"},q.name), el("td",{},String(q.rows)), el("td",{},q.truncated?"yes":"no")))))));
  const outs=v.receipts.filter(r=>r.stdout_excerpt);
  if(outs.length) body.append(el("details",{}, el("summary",{},`Raw probe output (${outs.length})`),
    outs.map(r=>el("pre",{class:"out"}, `${r.result}  ${hashText(r.obligation_hash)}\n${r.stdout_excerpt}`))));
  return sec;
}
function hashText(h){ return String(h).replace(/^sha256:/,"").slice(0,8); }
function pairScore(svc,v,rm){ return v.obligations.some(o=>o.tuple.service===svc&&rm[o.obligation_hash]&&rm[o.obligation_hash].result==="FAIL")?1:0; }

function chainView(ob, receipt){
  const failed=!!receipt && receipt.result==="FAIL";
  // Two-row schematic once the path is long: row 1 ends with the relationship that continues below.
  const path=ob.witness_path, split=path.length>4?Math.ceil(path.length/2):path.length;
  const chain=el("div",{class:"chain"});
  let row=el("div",{class:"crow"}); chain.append(row);
  path.forEach((h,i)=>{
    const rid = typeof h.id==="string" && h.id.startsWith("release:") ? lab(h.id) : null;
    row.append(el("div",{class:"node"+(failed&&i===path.length-1?" hit":"")}, el("div",{class:"lbl"},h.label),
      el("div",{class:"id",title:h.id},rid||h.display||h.id)));
    if(!h.rel_to_next) return;
    if(i+1===split && split<path.length){
      row.append(el("div",{class:"edge",title:"the path continues on the next row"},h.rel_to_next+" ↴"));
      row=el("div",{class:"crow"}); chain.append(row);
    } else row.append(el("div",{class:"edge"},h.rel_to_next));
  });
  return chain;
}

function matrixView(v, rm){
  const readers=[...new Map(v.obligations.map(o=>[o.tuple.release_id,o.tuple.service])).keys()];
  const recs=[...new Map(v.obligations.map(o=>[o.tuple.record_id,o])).values()];
  const head=el("tr",{}, el("th",{},"Reader"), recs.map(o=>el("th",{}, o.tuple.record_id,
    el("small",{}, o.tuple.format_id+" · saved by "+(o.writer_release_id===null?"unknown release":lab(o.writer_release_id))))));
  const rows=readers.map(rid=>el("tr",{}, el("td",{class:"rh"},lab(rid)),
    recs.map(rc=>{
      const obs=v.obligations.filter(o=>o.tuple.release_id===rid&&o.tuple.record_id===rc.tuple.record_id);
      if(!obs.length) return el("td",{}, el("span",{class:"na",title:"This reader never meets this record in this plan"},"—"));
      return el("td",{}, obs.map(o=>{ const r=rm[o.obligation_hash]; const k=r?r.result:"NONE";
        return el("button",{class:`cellbtn ${k}${S.sel===o.obligation_hash?" sel":""}`,"aria-pressed":String(S.sel===o.obligation_hash),
          title:"route "+o.tuple.route_id, onclick:()=>{S.sel=o.obligation_hash;render();}}, r?r.result:"no receipt"); }));
    })));
  return el("div",{class:"sub"}, el("h3",{},"Reader × retained record", el("small",{},"select a cell to see its receipt")),
    el("div",{style:"overflow-x:auto"}, el("table",{class:"matrix"}, el("thead",{},head), el("tbody",{},rows))));
}

function receiptView(ob, r){
  const box=el("div",{class:"receipt"});
  box.append(el("h4",{},`${lab(ob.tuple.release_id)} reading ${ob.tuple.record_id}`));
  if(!r){ box.append(el("p",{style:"margin:0"},"No receipt exists for this check (obligation ", hash(ob.obligation_hash), "), so it counts as unresolved.")); return box; }
  const err = r.error_type ? r.error_type+(r.message?": "+r.message:"") : (r.message||null);
  const kv=[["Result",r.result],["Harness exit",r.harness_exit===null?"none (timed out)":String(r.harness_exit)],["Error",err],
    ["Payload",hash(r.tuple.payload_hash)],["Reader",hash(r.tuple.reader_hash||r.tuple.codec_hash)],["Obligation",hash(r.obligation_hash)],["Duration",r.duration_ms+" ms"]]
    .filter(([k,x])=>!(x===undefined||(k==="Error"&&x===null)));
  box.append(el("dl",{class:"kv"}, kv.map(([k,x])=>[el("dt",{},k), el("dd",{}, x===null||x===undefined?el("span",{class:"na"},"none"):(typeof x==="string"?el("span",{class:k==="Error"||k==="Result"?"mono":""},x):x))])));
  return box;
}

function altView(){
  const a=cur(), d=disp(a), all=attempts(), plans=all.filter(x=>x.plan);
  const body=el("div",{class:"body"});
  const lastPlan=plans[plans.length-1];
  const can=(d==="BLOCKED"||d==="NEEDS_EVIDENCE") && plans.length<2 && a===lastPlan;
  if(can){
    let pick=null;
    if(S.inv.mode==="replay"){
      const items=S.transcripts.filter(t=>t.request_text===S.inv.request_text && t.outcome!=="question" && !(S.replayUsed||[]).includes(t.replay_path));
      pick=replayPicker("altpick","altReplay","Saved run for the alternative",items);
    }
    body.append(el("p",{style:"margin:0;max-width:64ch"},`The agent gets the facts from this check — which records failed or are unresolved — and may propose one different plan. It needs its own scope confirmation.`),
      el("div",{class:"row"}, pick, el("button",{class:"quiet",type:"button",onclick:askAlt,disabled:!!S.busy||(S.inv.mode==="replay"&&!S.form.altReplay)},"Ask agent for an alternative")));
  }
  if(plans.length>=2){
    body.append(el("div",{class:"cands"}, plans.map(p=>{
      const i=all.indexOf(p), dd=disp(p);
      const changes=p.plan.fleet.filter(f=>f.changed).map(f=>f.service+" "+(f.proposed_version||"?")+(Object.keys(f.flags).length?" with "+Object.entries(f.flags).map(([k,x])=>k+" = "+x).join(", "):"")).join("; ")||"no change";
      return el("div",{}, el("div",{class:S.view===i?"on":""}, el("b",{},p.plan.label||("candidate "+(i+1)))),
        el("div",{class:"v "+(dd||"")}, dd||"not checked yet"), el("div",{}, changes),
        S.view===i? el("p",{class:"hint"},"shown above") : el("p",{style:"margin:6px 0 0"}, el("button",{class:"quiet",type:"button",onclick:()=>{S.view=i;S.sel=null;render();}},"Show this plan")));
    })));
  }
  if(!body.childNodes.length) return null;
  return el("section",{class:"sec"}, el("h2",{},"Alternative"), body);
}

function actionView(a){
  if(disp(a)!=="BOUNDED_PASS") return null;               // rendered only when this plan is BOUNDED_PASS
  const sec=el("section",{class:"sec"}, el("h2",{},"Action"));
  const body=el("div",{class:"body"}); sec.append(body);
  body.append(el("span",{class:"only"},"LOCAL SIMULATION ONLY"), el("p",{style:"margin:0 0 4px;max-width:64ch"},"Nothing is deployed. Approval is a separate human decision from the scope you confirmed earlier, and is tied to this exact plan and these exact check results."));
  if(!a.approval){
    body.append(el("div",{class:"row"}, field("Approver","approver","approver",{ph:"your name, not the model",after:()=>{const b=document.getElementById("apprbtn"); if(b) b.disabled=!!S.busy||!S.form.approver.trim();}}),
      el("button",{id:"apprbtn",type:"button",onclick:()=>approve(a),disabled:!!S.busy||!S.form.approver.trim()},"Approve local simulation")));
  } else {
    body.append(el("p",{},"Approved by ", el("b",{},a.approval.approved_by), " at ", el("span",{class:"mono"},a.approval.approved_at), "."),
      el("button",{type:"button",onclick:()=>simulate(a),disabled:!!S.busy},"Run simulation"));
  }
  if(a.simulation){
    const s=a.simulation;
    body.append(el("div",{class:"simdone"}, el("b",{}, s.applied?"Simulated. No deployment happened.":"Already simulated — this repeat request changed nothing."),
      el("dl",{class:"kv"},
        el("dt",{},"applied"), el("dd",{class:"mono"}, String(s.applied)),
        el("dt",{},"idempotency key"), el("dd",{}, hash(s.idempotency_key)),
        el("dt",{},"fleet before"), el("dd",{}, hash(s.previous_fleet_hash)),
        el("dt",{},"fleet after"), el("dd",{}, hash(s.new_fleet_hash)),
        el("dt",{},"at"), el("dd",{class:"mono"}, s.applied_at))));
  }
  return sec;
}

function render(){
  const app=document.getElementById("app");
  const ae=document.activeElement, keep=ae&&ae.id, sx=window.scrollX, sy=window.scrollY;
  app.replaceChildren();
  app.append(requestView());
  if(S.busy) app.append(el("div",{class:"busy",role:"status"},S.busy));
  const fault=faultView(); if(fault) app.append(fault);
  if(S.inv){
    const all=attempts(), a=cur(), idx=all.indexOf(a);
    const plansOnly=all.filter(x=>!isAsk(x));
    if(plansOnly.length>1) app.append(el("div",{class:"row"}, el("span",{class:"mute"},"Showing:"), el("div",{class:"seg"}, plansOnly.map(x=>{
      const i=all.indexOf(x); return el("button",{type:"button","aria-pressed":String(S.view===i),onclick:()=>{S.view=i;S.sel=null;render();}}, (x.plan&&x.plan.label)||("attempt "+(i+1)));}))));
    if(isAsk(a)) app.append(askView(a, !S.inv.answered && idx===all.length-1));
    else {
      const note=answeredNote(); if(note) app.append(note);
      const f=fleetView(a); if(f) app.append(f);
      if(a.plan) app.append(scopeView(a));
      if(a.report) app.append(resultView(a));
      const alt=altView(); if(alt) app.append(alt);
      const act=actionView(a); if(act) app.append(act);
    }
  }
  bar();
  const foot=document.getElementById("foot");
  foot.replaceChildren(el("p",{}, el("b",{},"Synthetic fixture."), " Every service, release, record and result here comes from a made-up dataset; local simulation only."),
    el("p",{}, CAPTION_PASS), ...(S.inv? [el("p",{}, "Snapshot manifest ", hash(S.inv.snapshot_manifest_hash), ". Short hashes expand on click.")]:[]));
  if(keep){ const n=document.getElementById(keep); if(n){ n.focus(); if(n.setSelectionRange&&n.type==="text"){const l=n.value.length;n.setSelectionRange(l,l);} } }
  if(S.scrollTo){ const t=document.getElementById(S.scrollTo); S.scrollTo=null; if(t) t.scrollIntoView({block:"start"}); }
  else window.scrollTo(sx,sy);
}
fetch("/api/transcripts").then(r=>r.ok?r.json():[]).catch(()=>[]).then(t=>{S.transcripts=t; render();});
render();
</script>
